name: AXEZENT protect public GitHub Actions from audio downloads
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protect-github-artifacts.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy AXEZENT artist showcase to GitHub Pages']
    types: [completed]
permissions:
  contents: read
  actions: write
jobs:
  purge-public-downloads:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove public Actions archives containing audio, preserve all code and live Pages site
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh api --paginate "/repos/$repo/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id,.name,.size_in_bytes] | @tsv' > "$RUNNER_TEMP/axz_before.tsv"
          count=0
          bytes=0
          while IFS=$'\t' read -r id name size; do
            case "$name" in
              github-pages|axezent-review-batch-*|AXEZENT-50-REVIEW-BEATS*|AXEZENT-50-V*-VOLUME-*)
                case "$id" in *[!0-9]*|'') echo "Bad artifact ID"; exit 1;; esac
                gh api --method DELETE "/repos/$repo/actions/artifacts/$id" --silent
                count=$((count+1))
                bytes=$((bytes+size))
                ;;
            esac
          done < "$RUNNER_TEMP/axz_before.tsv"
          echo "Removed $count public audio-bearing build artifacts, $bytes total stored bytes"
          echo "GitHub Pages remains published independently of its temporary Actions upload artifact."
          sleep 3
          gh api --paginate "/repos/$repo/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id,.name] | @tsv' > "$RUNNER_TEMP/axz_after.tsv"
          while IFS=$'\t' read -r id name; do
            case "$name" in
              github-pages|axezent-review-batch-*|AXEZENT-50-REVIEW-BEATS*|AXEZENT-50-V*-VOLUME-*)
                echo "::error::Audio-bearing artifact still downloadable: $name"
                exit 1
                ;;
            esac
          done < "$RUNNER_TEMP/axz_after.tsv"
          echo "PASS: no GitHub Actions artifacts containing downloadable AXEZENT music archives remain"
