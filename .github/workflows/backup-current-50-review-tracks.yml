name: Preserve AXEZENT 50 Current Review Tracks - Backup ZIP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-current-50-review-tracks.yml'
permissions:
  contents: read
  actions: read
jobs:
  build-complete-listening-backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout catalog and arrangement manifests
        uses: actions/checkout@v4
      - name: Recover the five already verified audio batches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _owner_archive/recordings
          gh run download 42442178502 --repo "${{ github.repository }}" --pattern 'axezent-review-batch-*' --dir _downloaded_audio
          found=$(find _downloaded_audio -type f -name 'AXZ-*-review.mp3' | wc -l)
          test "$found" -eq 50
          find _downloaded_audio -type f -name 'AXZ-*-review.mp3' -exec cp --no-clobber -t _owner_archive/recordings {} +
          test "$(find _owner_archive/recordings -maxdepth 1 -name '*.mp3' | wc -l)" -eq 50
      - name: Install MP3 inspection utility
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
      - name: Audit 50 exact catalog identities, full MP3s and SHA256s
        run: |
          python - <<'PY'
          import json,pathlib,hashlib,subprocess,shutil
          root=pathlib.Path("_owner_archive")
          tracks=json.loads(pathlib.Path("data/catalog.json").read_text("utf-8"))
          plans=json.loads(pathlib.Path("data/arrangements.json").read_text("utf-8"))
          ordered=sorted((b for b in tracks if isinstance(b.get("releaseRank"),int) and 1<=b["releaseRank"]<=50),key=lambda b:b["releaseRank"])
          assert len(ordered)==len(plans)==50
          report=[]
          for beat in ordered:
              file=root/"recordings"/(beat["id"]+"-review.mp3")
              assert file.is_file() and file.stat().st_size>=150000
              info=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries",
                  "format=duration:stream=codec_name,channels","-of","json",str(file)]))
              assert info["streams"][0]["codec_name"]=="mp3"
              assert info["streams"][0]["channels"]==2
              seconds=float(info["format"]["duration"])
              assert abs(seconds-plans[beat["id"]]["durationSeconds"])<0.6
              sha=hashlib.sha256(file.read_bytes()).hexdigest()
              report.append({"rank":beat["releaseRank"],"id":beat["id"],"title":beat["title"],
                "city":beat["city"],"region":beat["collection"],"bpm":beat["bpm"],
                "key":beat["key"],"durationSeconds":round(seconds,3),
                "sizeBytes":file.stat().st_size,"sha256":sha,"path":str(file.relative_to(root))})
          assert len({b["sha256"] for b in report})==50
          (root/"TRACK_INVENTORY_SHA256.json").write_text(json.dumps(report,indent=2)+"\n","utf-8")
          (root/"SHA256SUMS.txt").write_text("".join(f'{b["sha256"]}  {b["path"]}\n' for b in report),"utf-8")
          shutil.copyfile("data/arrangements.json",root/"FULL_ARRANGEMENTS.json")
          shutil.copyfile("data/catalog.json",root/"ORIGINAL_CATALOG_200_ENTRIES.json")
          (root/"READ_ME_FIRST.txt").write_text(
            "AXEZENT — V3 50 AUDIO-LEVEL-CORRECTED REVIEW MP3S BACKUP\n"
            "These are 50 NEW synthetic sampled-instrument review mixes published by "
            "GitHub Pages deployment run 42442178502.\n"
            "They are NOT the exact historic private NODESS/ChatGPT mixes, NOT the "
            "unreleased sale masters, and NOT verified exclusive commercial inventory.\n"
            "For owner audit/long-term backup. The ZIP includes 50 stereo full-length "
            "MP3s, song arrangements, catalog metadata, hashes and verified track identity.\n"
            "These 44.1 kHz 160kbps review MP3s have corrected gain, EQ and peak limiting; they remain sampled-instrument reviews, not the private masters.\n"
            "SHA256SUMS.txt can be checked with sha256sum -c SHA256SUMS.txt inside this folder.\n",
            "utf-8")
          print("PASS: catalog IDs, 50 distinct stereo MP3s, exact durations and checksum inventory.")
          PY
      - name: Pack one owner-friendly ZIP and verify archive integrity
        run: |
          python - <<'PY'
          import os,pathlib,zipfile,hashlib
          root=pathlib.Path("_owner_archive")
          dest=pathlib.Path("AXEZENT_50_REVIEW_BEATS_V3_AUDIBLE_2026-11-07.zip")
          with zipfile.ZipFile(dest,"w",compression=zipfile.ZIP_STORED,allowZip64=True) as out:
              for item in sorted(root.rglob("*")):
                  if item.is_file():
                      out.write(item,arcname="AXEZENT_50_REVIEW_BEATS/"+str(item.relative_to(root)))
          with zipfile.ZipFile(dest) as verify:
              assert verify.testzip() is None
              assert len([n for n in verify.namelist() if n.endswith(".mp3")])==50
          print(f"PASS: single ZIP {dest.name}: {dest.stat().st_size} bytes.")
          print("ZIP SHA-256:",hashlib.sha256(dest.read_bytes()).hexdigest())
          PY
      - name: Create two smaller independent owner backup volumes for connected Drive storage
        run: |
          python - <<'PY'
          import json,zipfile,pathlib
          root=pathlib.Path("_owner_archive")
          inventory=json.loads((root/"TRACK_INVENTORY_SHA256.json").read_text("utf-8"))
          assert len(inventory)==50
          names=[]
          for number,subset in [(1,inventory[:25]),(2,inventory[25:])]:
              output=pathlib.Path(f"AXEZENT_V3_BACKUP_VOLUME_{number:02d}_OF_02.zip")
              with zipfile.ZipFile(output,"w",compression=zipfile.ZIP_STORED,allowZip64=True) as z:
                  for row in subset:
                      recording=root/row["path"]
                      assert recording.is_file()
                      z.write(recording,arcname=row["path"])
                  for filename in ["TRACK_INVENTORY_SHA256.json","SHA256SUMS.txt",
                                   "FULL_ARRANGEMENTS.json","ORIGINAL_CATALOG_200_ENTRIES.json","READ_ME_FIRST.txt"]:
                      z.write(root/filename,arcname=filename)
              with zipfile.ZipFile(output) as z:
                  assert z.testzip() is None
                  assert len([n for n in z.namelist() if n.endswith(".mp3")])==25
              assert output.stat().st_size<100_000_000,"Drive file must stay below connector size limit"
              names.append(str(output))
          print("PASS: 2 independent 25-song ZIP volumes fit under Drive upload limit",names)
          PY
      - name: Store backup volume 1
        uses: actions/upload-artifact@v4
        with:
          name: AXEZENT-50-V3-VOLUME-01-OF-02
          path: AXEZENT_V3_BACKUP_VOLUME_01_OF_02.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Store backup volume 2
        uses: actions/upload-artifact@v4
        with:
          name: AXEZENT-50-V3-VOLUME-02-OF-02
          path: AXEZENT_V3_BACKUP_VOLUME_02_OF_02.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Store complete downloadable ZIP in GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: AXEZENT-50-REVIEW-BEATS-V3-BACKUP
          path: AXEZENT_50_REVIEW_BEATS_V3_AUDIBLE_2026-11-07.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
