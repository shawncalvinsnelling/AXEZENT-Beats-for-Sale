name: AXEZENT owner-only backup safety notice
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protect-owner-recordings:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm public music ZIP generation is disabled
        run: |
          echo "PROTECTED: No ZIP of 50 beat recordings is generated or uploaded to this public repository."
          echo "Keep owner backups in a private repository, private Drive, or offline encrypted storage."
          echo "Public GitHub Actions artifacts are visible to readers of a public repository."
