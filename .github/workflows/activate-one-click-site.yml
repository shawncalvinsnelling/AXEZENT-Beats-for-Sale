name: AXEZENT legacy site-link activation is read-only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-no-repo-write:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the customer Pages link and README under owner control
        run: |
          echo "Legacy workflow cannot push to the repository."
          echo "AXEZENT public customer site is managed by the Pages deployment workflow."
          echo "No README edits or Git writes are performed by this action."
