name: AXEZENT Collection Quality
on:
  push:
    branches: [main, studio-performance-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MIDI checks
        run: python -m pip install --disable-pip-version-check "mido>=1.3,<2"
      - name: Inspect all 100 priority and untouched MIDI arrangements
        run: |
          python -m unittest discover -s tests -p 'test_music_a_z_enhance.py' -v
          python -m unittest discover -s tests -p 'test_studio_performance.py' -v
      - name: Validate entire original and second collection contracts
        run: |
          python -m unittest discover -s tests -p 'test_arrangements_contract.py' -v
          python -m unittest discover -s tests -p 'test_collection_two.py' -v
      - name: Verify 100-beat page and session-count event semantics
        run: |
          node --check pages-showcase/counters.js
          node --check pages-showcase/showcase.js
          node tests/test_public_counters.mjs
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio and DSP test tools
        run: |
          python -m pip install --disable-pip-version-check "mido>=1.3,<2" "numpy>=1.26,<3"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fluidsynth fluid-soundfont-gm ffmpeg
      - name: Generate real candidate audio for original and second-collection priority songs
        run: |
          python -m scripts.render_priority_review_audio --out _smoke/first --start 16 --end 16
          python scripts/render_collection_two_review_audio.py --out _smoke/second58 --start 58 --end 58
          python scripts/render_collection_two_review_audio.py --out _smoke/second82 --start 82 --end 82
          python scripts/render_collection_two_review_audio.py --out _smoke/second83 --start 83 --end 83
      - name: Audit priority production candidates privately, never request a public master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _smoke/focus
          for rank in 5 9 25 37; do
            python -m scripts.render_priority_review_audio --out _smoke/focus --start "$rank" --end "$rank" >/dev/null
          done
          python - <<'PY'
          import json,pathlib
          from scripts.collection_two import make_collection_two_catalog
          from scripts.audit_loudness import measure
          from scripts.audit_audio_depth import one
          root=pathlib.Path('.')
          orig=json.loads((root/'data/catalog.json').read_text())
          plans=json.loads((root/'data/arrangements.json').read_text())
          catalog,allplans=make_collection_two_catalog(orig,plans)
          beats={x['id']:x for x in catalog}
          ids=('AXZ-037','AXZ-049','AXZ-089','AXZ-189')
          out=root/'_smoke/focus'
          for ident in ids:
              media=out/(ident+'-review.mp3')
              assert media.is_file() and media.stat().st_size>150000,ident
              lufs,peak,_=measure(media)
              qc=one(beats[ident],allplans[ident],out)
              if not (-19<=lufs<=-11 and peak<=-.8) or qc['hardFailures']:
                  raise ValueError('Local candidate failed musical engineering QA: '+ident)
              verse=qc['excerpts']['verse']
              hook=qc['excerpts']['hook']
              if min(verse['monoRetention'],hook['monoRetention'])<.68:
                  raise ValueError('Candidate has weak mono retention: '+ident)
          print('PASS: four private review candidates meet measurable audio gates; none published')
          PY
      - name: Audit rendered candidate excerpts, true peak and stereo
        run: |
          python - <<'PY'
          import json, pathlib
          from scripts.collection_two import make_collection_two_catalog
          from scripts.audit_loudness import measure
          from scripts.audit_audio_depth import one
          root=pathlib.Path('.')
          orig=json.loads((root/'data/catalog.json').read_text())
          original_plans=json.loads((root/'data/arrangements.json').read_text())
          catalog,plans=make_collection_two_catalog(orig,original_plans)
          beats={b['id']:b for b in catalog}
          specs=[
             ('AXZ-185','_smoke/first'),('AXZ-172','_smoke/second58'),
             ('AXZ-187','_smoke/second82'),('AXZ-010','_smoke/second83')
          ]
          for ident,folder in specs:
              beat=beats[ident]
              directory=root/folder
              f=directory/(ident+'-review.mp3')
              assert f.exists() and f.stat().st_size>150000
              report=one(beat,plans[ident],directory)
              lufs,peak,lra=measure(f)
              print('PASS: candidate audio met mix safety gates')
              assert -19<=lufs<=-11 and peak<=-0.8,ident
              assert not report['hardFailures'],ident
          PY
