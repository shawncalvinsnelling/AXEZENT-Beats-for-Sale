name: Independent loudness and peak QA - 100 AXEZENT review tracks
on:
  workflow_run:
    workflows: ['Deploy AXEZENT artist showcase to GitHub Pages']
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  measure-all-audio:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install independent MP3 analyzer
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
      - name: Install independent numerical FFT analyzer
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3"
      - name: Audit the publicly audible tracks without downloading private Actions artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _review_audio
          python - <<'PY'
          import json,pathlib,subprocess,time,urllib.request
          base="https://shawncalvinsnelling.github.io/AXEZENT-Beats-for-Sale/"
          manifest=json.loads(urllib.request.urlopen(base+"data/public-preview-manifest.json",timeout=30).read())
          data_dir=pathlib.Path("_review_site_data")
          data_dir.mkdir(exist_ok=True)
          for file in ("catalog.json","arrangements.json"):
              data_dir.joinpath(file).write_bytes(
                  urllib.request.urlopen(base+"data/"+file,timeout=40).read())
          catalog=json.loads((data_dir/"catalog.json").read_text("utf-8"))
          plans=json.loads((data_dir/"arrangements.json").read_text("utf-8"))
          if len(manifest)!=100 or len(plans)!=100 or len(catalog)!=200:
              raise RuntimeError("Expected exactly 100 live preview links and 100 individual arrangements")
          out=pathlib.Path("_review_audio")
          for index,(ident,path) in enumerate(manifest.items(),1):
              if path!="./review-audio/"+ident+"-review.mp3":
                  raise RuntimeError("Unexpected public MP3 path "+ident)
              dest=out/(ident+"-review.mp3")
              for attempt in range(4):
                  proc=subprocess.run(["curl","-fL","-sS","--retry","2","--retry-delay","2",
                    "--connect-timeout","20","--max-time","90","-o",str(dest),base+path[2:]])
                  if proc.returncode==0 and dest.exists() and dest.stat().st_size>150000:
                      break
                  if attempt==3:
                      raise RuntimeError("Public Pages audio inaccessible: "+ident)
                  time.sleep(5)
          assert len(list(out.glob("*-review.mp3")))==100
          print("PASS: obtained all 100 full-length MP3s from the customer-accessible player endpoints")
          PY
      - name: Check integrated LUFS, decoded true peak, dynamic range and file integrity
        run: python scripts/audit_loudness.py --audio-dir _review_audio --catalog _review_site_data/catalog.json --arrangements _review_site_data/arrangements.json --report AXEZENT_100_TRACK_AUDIO_QA.json
      - name: Inspect actual decoded stereo, spectral masking, transient pulse, section energy and mix similarity
        run: python scripts/audit_audio_depth.py --audio-dir _review_audio --catalog _review_site_data/catalog.json --arrangements _review_site_data/arrangements.json --report AXEZENT_100_TRACK_DEPTH_QA.json
      - name: Preserve the objective results for the owner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AXEZENT-100-TRACK-OBJECTIVE-AUDIO-QA
          path: |
            AXEZENT_100_TRACK_AUDIO_QA.json
            AXEZENT_100_TRACK_DEPTH_QA.json
          if-no-files-found: warn
          retention-days: 90
