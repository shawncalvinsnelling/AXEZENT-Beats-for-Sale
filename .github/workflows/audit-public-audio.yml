name: AXEZENT independent security check - no unfinished audio exposed
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy AXEZENT artist showcase to GitHub Pages']
    types: [completed]
permissions:
  contents: read
jobs:
  exposure-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify current public site has 100 titles but zero original audio files
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures,json,time,urllib.request,urllib.error
          BASE="https://shawncalvinsnelling.github.io/AXEZENT-Beats-for-Sale/"
          headers={"User-Agent":"AXEZENT-No-Public-Masters-Guard/1.0","Cache-Control":"no-cache"}
          def read(path):
              req=urllib.request.Request(BASE+path,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  assert r.status==200,(path,r.status)
                  return r.read()
          def status(path):
              req=urllib.request.Request(BASE+path,headers=headers,method="HEAD")
              try:
                  with urllib.request.urlopen(req,timeout=18) as r:return r.status
              except urllib.error.HTTPError as e:return e.code
          def scan(paths):
              with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
                  return [(p,n) for p,n in zip(paths,pool.map(status,paths)) if n not in (404,410)]
          manifest=json.loads(read("data/public-preview-manifest.json"))
          assert manifest=={},("Audio manifest is not disabled",len(manifest))
          catalog=json.loads(read("data/catalog.json"))
          songs=[b for b in catalog if isinstance(b.get("releaseRank"),int) and 1<=b["releaseRank"]<=100]
          assert len(catalog)==200 and len(songs)==100 and len({b["id"] for b in songs})==100
          js=read("assets/showcase.js").decode("utf8")
          assert "./approved-previews/" in js and "-tagged.mp3" in js
          assert "compactActive" not in js and "review-audio/" not in js
          old_files=[f"review-audio/{b['id']}{suffix}" for b in songs for suffix in ("-review.mp3","-listen.m4a")]
          old_files+=["data/arrangements.json"]
          leaks=[]
          for attempt in range(6):
              leaks=scan(old_files)
              if not leaks:break
              print("Old files still reachable, possibly CDN-cached",len(leaks),leaks[:6],"attempt",attempt+1,flush=True)
              time.sleep(10)
          assert not leaks,("Unfinished song URLs publicly reachable",leaks[:20])
          print("PASS: 100 titles, zero approved public audio, 200 old master/listen file links return 404/410; no arrangement map")
          PY
