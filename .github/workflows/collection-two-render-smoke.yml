name: Collection Two - real four-city audio smoke
on:
  push:
    branches: [collection-two-100-city-launch-20261108]
    paths:
      - 'data/collection-two-blueprints.zlib'
      - 'scripts/collection_two.py'
      - 'scripts/render_collection_two_review_audio.py'
      - 'tests/test_collection_two.py'
      - '.github/workflows/collection-two-render-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tested MIDI SoundFont renderer
        run: |
          python -m pip install --disable-pip-version-check "mido>=1.3,<2"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fluidsynth fluid-soundfont-gm ffmpeg
      - name: Test full 100 city inventory without mutating original 50
        run: python -m unittest discover -s tests -p 'test_collection_two.py' -v
      - name: Render four real regional preview tracks from different musical families
        run: |
          set -euo pipefail
          for rank in 51 52 66 100; do
            python scripts/render_collection_two_review_audio.py --start "$rank" --end "$rank" --out "$RUNNER_TEMP/new-collection"
          done
          python - <<'PY'
          from pathlib import Path
          import hashlib
          folder=Path(__import__('os').environ['RUNNER_TEMP'])/'new-collection'
          files=sorted(folder.glob('AXZ-*-review.mp3'))
          assert len(files)==4,files
          assert all(x.stat().st_size>150000 for x in files)
          assert len(set(hashlib.sha256(x.read_bytes()).hexdigest() for x in files))==4
          print('PASS: four original new-review MP3 mixes rendered, unique, full length, and stereo')
          PY
      - name: Preserve MP3 smoke-test report (not private audio masters)
        if: always()
        run: |
          echo 'The original first 50 MP3s were not modified by this branch.' > collection-two-smoke-summary.txt
