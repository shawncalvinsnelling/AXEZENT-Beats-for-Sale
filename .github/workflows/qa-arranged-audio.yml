name: QA new AXEZENT instrument-based audio arrangements
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render_arranged_review_audio.py'
      - 'data/arrangements.json'
      - 'data/catalog.json'
      - 'tests/test_arrangements_contract.py'
      - '.github/workflows/qa-arranged-audio.yml'
permissions:
  contents: read
jobs:
  review-audio-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline GM instruments and renderer
        run: |
          python -m pip install --disable-pip-version-check "mido>=1.3,<2"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fluidsynth timgm6mb-soundfont ffmpeg
          test -s /usr/share/sounds/sf2/TimGM6mb.sf2
          command -v fluidsynth
      - name: Verify 50 proposed bar-exact arrangement contracts
        run: python -m unittest discover -s tests -p 'test_arrangements_contract.py' -v
      - name: Render 3 different original NEW review arrangements
        run: |
          set -euo pipefail
          python scripts/render_arranged_review_audio.py --start 1 --end 3 --out "${{ runner.temp }}/axezent-audio-qa"
          test "$(find "${{ runner.temp }}/axezent-audio-qa" -maxdepth 1 -name '*-review.mp3' | wc -l)" -eq 3
      - name: Verify audio stream identity, duration and files
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          root=pathlib.Path("${{ runner.temp }}/axezent-audio-qa")
          report=json.loads((root/"REVIEW_REPORT.json").read_text())
          assert len(report)==3
          for t in report:
              assert t["size"]>150000
              assert t["midiEvents"]>150
              assert "NOT the original private" in t["qualityStatus"]
              ff=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","stream=codec_name,channels:format=duration","-of","json",str(root/(t["id"]+"-review.mp3"))]))
              assert ff["streams"][0]["codec_name"]=="mp3"
              assert ff["streams"][0]["channels"]==2
          print("PASS: 3 new full song arrangements are real stereo MP3s; private originals untouched.")
          PY
      - name: Do not publish unapproved mixes
        run: echo "These 3 examples are for audio engine QA only. They are not studio masters or releases."
