name: Deploy AXEZENT artist showcase to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pages-showcase/**'
      - 'data/catalog.json'
      - 'data/public-preview-manifest.json'
      - 'assets/styles.css'
      - 'assets/favicon.svg'
      - '.github/workflows/deploy-artist-showcase.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: axezent-artist-showcase-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create isolated public showcase artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pages_build/assets _pages_build/data
          cp pages-showcase/index.html _pages_build/index.html
          cp pages-showcase/showcase.js _pages_build/assets/showcase.js
          cp assets/styles.css assets/favicon.svg _pages_build/assets/
          cp data/public-preview-manifest.json _pages_build/data/public-preview-manifest.json
          node -e '
            const fs=require("fs");
            const beats=JSON.parse(fs.readFileSync("data/catalog.json","utf8"));
            const safe=beats.map(({id,title,city,state,collection,bpm,key,releaseRank})=>({id,title,city,state,collection,bpm,key,releaseRank}));
            if(safe.length!==200||safe.filter(b=>Number.isInteger(b.releaseRank)&&b.releaseRank>=1&&b.releaseRank<=50).length!==50)throw Error("Catalog check failed");
            fs.writeFileSync("_pages_build/data/catalog.json",JSON.stringify(safe));
          '
          touch _pages_build/.nojekyll
      - name: Validate static showcase and original-site visual features
        run: |
          set -euo pipefail
          node --check _pages_build/assets/showcase.js
          node -e '
            const fs=require("fs");
            const h=fs.readFileSync("_pages_build/index.html","utf8");
            const j=fs.readFileSync("_pages_build/assets/showcase.js","utf8");
            const cat=JSON.parse(fs.readFileSync("_pages_build/data/catalog.json","utf8"));
            const manifest=JSON.parse(fs.readFileSync("_pages_build/data/public-preview-manifest.json","utf8"));
            for(const needle of ["BEATS<br><em>FOR SALE.", "id=\"tracks\"", "id=\"query\"", "id=\"region\"", "id=\"playerDialog\"", "id=\"musicSeek\"", "id=\"musicRepeat\"", "assets/styles.css"]) {
              if(!h.includes(needle))throw Error("Missing original website visual/player feature: "+needle);
            }
            for(const marker of ["LISTENING VERSION", "EXPANDED VERSION", "Intro", "Hook", "Verse 1", "Verse 2", "Outro"]) {
              if(!h.includes(marker))throw Error("Missing preview/full arrangement explanation: "+marker);
            }
            if(j.includes("Discover AXEZENT")||j.includes("Preview coming soon")||j.includes("Coming soon"))throw Error("Old clutter labels remain in published player");
            if(!j.includes("play-button")||!j.includes("detail-button")||!j.includes("▶ Play"))throw Error("Expected compact player controls are missing");
            for(const forbidden of [/chatgpt[.]site/i,/paypal/i,/cash app/i,/mailto:/i,/private prototype/i,/synthetic review/i,/an online shop/i]) {
              if(forbidden.test(h))throw Error("Customer-facing page includes restricted text: "+forbidden);
            }
            if(!j.includes("public-preview-manifest.json")||!j.includes("musicRepeat.addEventListener")||!j.includes("seekTo"))throw Error("Public player code is incomplete");
            if(cat.length!==200 || cat.filter(x=>x.releaseRank>=1&&x.releaseRank<=50).length!==50)throw Error("Catalog count mismatch");
            if(!manifest||typeof manifest!=="object"||Array.isArray(manifest))throw Error("Invalid public preview manifest");
            for(const [id,url] of Object.entries(manifest)){
              if(!cat.some(b=>b.id===id&&b.releaseRank>=1&&b.releaseRank<=50))throw Error("Unknown preview ID "+id);
              if(typeof url!=="string"||!url.startsWith("https://"))throw Error("Only HTTPS preview URLs are allowed");
            }
            console.log("PASS: AXEZENT original interface, 50 entries, playback controls, safe public audio manifest");
          '
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public showcase
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages_build
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
