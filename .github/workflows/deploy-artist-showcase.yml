name: Deploy AXEZENT artist showcase to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pages-showcase/**'
      - 'data/catalog.json'
      - 'scripts/arrangement_spec.py'
      - 'scripts/render_previews.py'
      - 'scripts/build_public_listening_excerpts.py'
      - '.github/workflows/deploy-artist-showcase.yml'
      - 'assets/styles.css'
      - 'assets/favicon.svg'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: axezent-artist-showcase-pages
  cancel-in-progress: true
jobs:
  render-public-excerpts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        first_rank: [1,11,21,31,41]
    steps:
      - name: Checkout existing AXEZENT renderer
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthesis dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3'
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
      - name: Render 10 draft mixes and create SHORT public samples
        env:
          FIRST_RANK: ${{ matrix.first_rank }}
        run: |
          set -euo pipefail
          last_rank=$((FIRST_RANK+9))
          mkdir -p "$RUNNER_TEMP/axezent-review-private" "$RUNNER_TEMP/axezent-public-excerpts"
          python scripts/render_previews.py --catalog data/catalog.json --out "$RUNNER_TEMP/axezent-review-private" --start "$FIRST_RANK" --end "$last_rank"
          python scripts/build_public_listening_excerpts.py --catalog data/catalog.json --source "$RUNNER_TEMP/axezent-review-private" --destination "$RUNNER_TEMP/axezent-public-excerpts" --start "$FIRST_RANK" --end "$last_rank"
          found=$(find "$RUNNER_TEMP/axezent-public-excerpts" -maxdepth 1 -name 'AXZ-*-sample.mp3' | wc -l)
          test "$found" -eq 10
          echo "Batch $FIRST_RANK-$last_rank has 10 PUBLIC 30-second excerpts. Full review mixes stay in the temporary CI runner."
      - name: Upload ONLY short public listening samples
        uses: actions/upload-artifact@v4
        with:
          name: public-preview-batch-${{ matrix.first_rank }}
          path: ${{ runner.temp }}/axezent-public-excerpts/AXZ-*-sample.mp3
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  deploy:
    needs: render-public-excerpts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website source
        uses: actions/checkout@v4
      - name: Download 50 approved-length short listening excerpts
        uses: actions/download-artifact@v4
        with:
          pattern: public-preview-batch-*
          path: _pages_build/previews
          merge-multiple: true
      - name: Prepare static AXEZENT artist showcase and playable manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pages_build/assets _pages_build/data
          cp pages-showcase/index.html _pages_build/index.html
          cp pages-showcase/showcase.js _pages_build/assets/showcase.js
          cp assets/styles.css assets/favicon.svg _pages_build/assets/
          node -e '
            const fs=require("fs"),path=require("path");
            const beats=JSON.parse(fs.readFileSync("data/catalog.json","utf8"));
            const featured=beats.filter(b=>Number.isInteger(b.releaseRank)&&b.releaseRank>=1&&b.releaseRank<=50);
            if(beats.length!==200||featured.length!==50)throw Error("Catalog check failed");
            const safe=beats.map(({id,title,city,state,collection,bpm,key,releaseRank})=>({id,title,city,state,collection,bpm,key,releaseRank}));
            fs.writeFileSync("_pages_build/data/catalog.json",JSON.stringify(safe));
            const manifest={};
            for(const beat of featured){
              const file=beat.id+"-sample.mp3";
              const physical=path.join("_pages_build","previews",file);
              if(!fs.existsSync(physical))throw Error("Missing required audio file "+physical);
              const size=fs.statSync(physical).size;
              if(size<100000||size>700000)throw Error("Public preview size check failed "+file);
              manifest[beat.id]="./previews/"+file;
            }
            if(Object.keys(manifest).length!==50)throw Error("Expected 50 audible previews");
            fs.writeFileSync("_pages_build/data/public-preview-manifest.json",JSON.stringify(manifest));
            console.log("50 short audio files mapped to 50 featured beats");
          '
          if find _pages_build -name '*-tagged.mp3' | grep -q .; then
            echo "ERROR: Full-length private review MP3 accidentally included"
            exit 1
          fi
          touch _pages_build/.nojekyll
      - name: Validate HTML, player, and short audio links
        run: |
          set -euo pipefail
          node --check _pages_build/assets/showcase.js
          node -e '
            const fs=require("fs"),path=require("path");
            const h=fs.readFileSync("_pages_build/index.html","utf8");
            const j=fs.readFileSync("_pages_build/assets/showcase.js","utf8");
            const m=JSON.parse(fs.readFileSync("_pages_build/data/public-preview-manifest.json","utf8"));
            for(const marker of ["id=\"playerDialog\"","id=\"musicPlay\"","id=\"musicSeek\"","id=\"musicRepeat\"","id=\"tracks\""]){
              if(!h.includes(marker))throw Error("Missing player/layout feature "+marker);
            }
            if(!j.includes("document.baseURI")||!j.includes("musicRepeat.addEventListener"))throw Error("Audio player is not configured");
            if(Object.keys(m).length!==50)throw Error("Expected 50 active playable buttons");
            for(const preview of Object.values(m)){
              if(!(preview.startsWith("./previews/") && /^AXZ-[0-9]{3}-sample[.]mp3$/.test(preview.slice("./previews/".length))))throw Error("Unsafe preview URL "+preview);
              if(!fs.existsSync(path.join("_pages_build",preview)))throw Error("Broken audio link "+preview);
            }
            console.log("PASS: all 50 playable audio URL paths, player controls, no master files");
          '
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public website and 30-second preview samples
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages_build
      - name: Deploy GitHub HTTPS website
        id: deployment
        uses: actions/deploy-pages@v4
