name: Deploy AXEZENT artist showcase to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pages-showcase/**'
      - 'data/catalog.json'
      - 'data/arrangements.json'
      - 'data/collection-two-blueprints.zlib'
      - 'scripts/collection_two.py'
      - '.github/workflows/deploy-artist-showcase.yml'
      - 'assets/styles.css'
      - 'assets/favicon.svg'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: axezent-artist-showcase-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - name: Checkout website source only
        uses: actions/checkout@v4
      - name: Prepare public catalog WITHOUT public beat audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pages_build/assets _pages_build/data
          cp pages-showcase/index.html _pages_build/index.html
          cp pages-showcase/showcase.js pages-showcase/counters.js _pages_build/assets/
          cp assets/styles.css assets/favicon.svg assets/axezent-social-share.svg _pages_build/assets/
          python scripts/collection_two.py --public-data _pages_build/data
          python - <<'PY'
          import json,pathlib
          base=pathlib.Path('_pages_build/data')
          catalog=json.loads((base/'catalog.json').read_text('utf8'))
          chosen=[b for b in catalog if isinstance(b.get('releaseRank'),int) and 1<=b['releaseRank']<=100]
          assert len(catalog)==200 and len(chosen)==100 and len({b['id'] for b in chosen})==100
          names=('id','title','city','state','collection','bpm','key','releaseRank')
          (base/'catalog.json').write_text(json.dumps([{k:b[k] for k in names if k in b} for b in catalog],separators=(',',':'))+'\n',encoding='utf8')
          # Fail closed until the owner has approved individually watermarked clips.
          (base/'public-preview-manifest.json').write_text('{}\n',encoding='utf8')
          # Do not publish the producer's bar-level arrangement plans.
          (base/'arrangements.json').unlink(missing_ok=True)
          print('PASS: 100 searchable track cards, zero public audio URLs')
          PY
      - name: Independently enforce zero public recordings or ZIP downloads
        shell: bash
        run: |
          set -euo pipefail
          node --check _pages_build/assets/showcase.js
          node --check _pages_build/assets/counters.js
          node tests/test_public_counters.mjs
          python - <<'PY'
          import json,pathlib
          base=pathlib.Path('_pages_build')
          public_catalog=json.loads((base/'data/catalog.json').read_text('utf8'))
          assert len([t for t in public_catalog if isinstance(t.get('releaseRank'),int) and 1<=t['releaseRank']<=100])==100
          assert json.loads((base/'data/public-preview-manifest.json').read_text('utf8'))=={}
          assert not (base/'data/arrangements.json').exists()
          blocked={'.mp3','.m4a','.aac','.wav','.flac','.aiff','.ogg','.opus','.mid','.midi','.sf2','.zip','.7z','.rar','.mp4','.mov','.pdf','.docx'}
          leak=[str(p) for p in base.rglob('*') if p.is_file() and p.suffix.lower() in blocked]
          assert not leak,('Private media mistakenly selected for public Pages:',leak)
          assert not (base/'review-audio').exists()
          assert 'public-preview-manifest.json' in (base/'assets/showcase.js').read_text('utf8')
          assert 'axezentai@gmail.com' in (base/'index.html').read_text('utf8')
          (base/'.nojekyll').touch()
          print('PASS: 100-track catalog and inquiry links; NO public instrumentals, zipped masters or arrangement plans')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only safe storefront code and catalog
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages_build
      - name: Replace unsafe public Pages version with safe artist catalog
        uses: actions/deploy-pages@v4
