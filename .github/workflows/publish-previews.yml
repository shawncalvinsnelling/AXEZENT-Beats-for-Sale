name: Release approved tagged audio previews
on:
  push:
    branches: [main]
    paths:
      - 'previews/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-previews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate every preview and synchronize catalog
        run: |
          python scripts/sync_previews.py
          python scripts/check_catalog.py
      - name: Commit only verified catalog availability
        run: |
          if ! git diff --quiet -- data/catalog.json; then
            git config user.name "AXEZENT Preview Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/catalog.json
            git commit -m "Enable only verified public audio previews"
            git push
          fi
