name: AXEZENT Render 50 listening previews
on:
  push:
    branches: [main]
    paths:
      - 'scripts/render_previews.py'
      - '.github/workflows/render-review-audio.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: axezent-reproducible-audio
  cancel-in-progress: false
jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout AXEZENT
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3'
          ffmpeg -version | head -n 1
      - name: Check renderer before execution
        run: python -m py_compile scripts/render_previews.py
      - name: Render 50 original tagged stereo MP3 review sketches
        run: python scripts/render_previews.py --catalog data/catalog.json --out previews --start 1 --end 50
      - name: Verify audio properties and enable only existent previews
        run: |
          python scripts/sync_previews.py
          python scripts/update_readme_previews.py
          python scripts/check_catalog.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/catalog.json").read_text())
          ready=[x for x in d if x.get("status")=="preview_ready"]
          assert len(ready)==50, f"{len(ready)}/50 playable"
          assert all((Path(x["previewUrl"]).stat().st_size > 100000) for x in ready)
          print("PASS: 50/50 real, verified MP3s mapped to Play links")
          PY
      - name: Commit only verified MP3 previews and listening links
        run: |
          git config user.name "AXEZENT Audio Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/ data/catalog.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish 50 original audio review previews with working listen links"
            git push
          fi
