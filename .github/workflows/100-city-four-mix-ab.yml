name: AXEZENT four flagged mixes - controlled A/B audio review
on:
  push:
    branches: [100-beat-four-mix-ab-review-20261108]
    paths:
      - 'scripts/render_collection_two_review_audio.py'
      - 'scripts/compare_four_mix_ab.py'
      - '.github/workflows/100-city-four-mix-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ab-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SoundFont MIDI rendering and spectral analysis
        run: |
          python -m pip install "mido>=1.3,<2" "numpy>=1.26,<3"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fluidsynth fluid-soundfont-gm ffmpeg
      - name: Render four controlled A/B baseline-candidate mixes
        run: python -m scripts.compare_four_mix_ab --out "$RUNNER_TEMP/axezent-mix-ab"
      - name: Save measurement results only without MP3 files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AXEZENT-FOUR-TRACK-MIX-AB-REPORT-ONLY
          path: ${{ runner.temp }}/axezent-mix-ab/results/AB_AUDIO_COMPARISON.json
          retention-days: 45
          if-no-files-found: warn
