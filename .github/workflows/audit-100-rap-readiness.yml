name: AXEZENT 100 - rapper vocal space and note-grid mathematics
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_100_rap_readiness.py'
      - 'scripts/render_arranged_review_audio.py'
      - 'scripts/render_collection_two_review_audio.py'
      - 'scripts/collection_two.py'
      - 'data/collection-two-blueprints.zlib'
      - 'data/catalog.json'
      - 'data/arrangements.json'
      - '.github/workflows/audit-100-rap-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rap-grid:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact MIDI event tool
        run: python -m pip install --disable-pip-version-check "mido>=1.3,<2"
      - name: Audit all 100 exact city-specific drum, bass, lead and section grids
        run: python -m scripts.audit_100_rap_readiness --out 100-rap-grid-qa/
      - name: Keep production diagnostics inside the ephemeral test runner
        run: echo "PASS - private review outputs are intentionally not uploaded as public artifacts."
