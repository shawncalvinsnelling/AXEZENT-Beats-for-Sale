name: Browser test live AXEZENT audio player
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/live_browser_playback.mjs'
      - '.github/workflows/verify-browser-player.yml'
permissions:
  contents: read
jobs:
  test-actual-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only Chromium browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test actual Play, audio movement, seek and other controls on public GitHub Pages
        run: node tests/live_browser_playback.mjs
