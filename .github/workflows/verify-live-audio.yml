name: Verify safe AXEZENT public website - no unfinished full songs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-audio.yml'
permissions:
  contents: read
jobs:
  verify-private-by-default:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check 100 catalog titles, zero published audio, zero original fallback
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request,urllib.error
          base='https://shawncalvinsnelling.github.io/AXEZENT-Beats-for-Sale/'
          headers={'User-Agent':'AXEZENT-Private-By-Default-QA/1.0','Cache-Control':'no-cache'}
          def fetch(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=30) as r:
                  assert r.status==200
                  return r.read()
          def status(path):
              req=urllib.request.Request(base+path,headers=headers,method='HEAD')
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:return r.status
              except urllib.error.HTTPError as e:return e.code
          catalog=json.loads(fetch('data/catalog.json'))
          tracks=[t for t in catalog if isinstance(t.get('releaseRank'),int) and 1<=t['releaseRank']<=100]
          assert len(catalog)==200 and len(tracks)==100 and len({t['id'] for t in tracks})==100
          assert json.loads(fetch('data/public-preview-manifest.json'))=={}
          js=fetch('assets/showcase.js').decode('utf8')
          assert '-tagged.mp3' in js and 'approved-previews' in js
          assert 'compactActive' not in js and 'review-audio' not in js
          for ident in ['AXZ-037','AXZ-049','AXZ-089','AXZ-169']:
              for suffix in ('-review.mp3','-listen.m4a'):
                  url='review-audio/'+ident+suffix
                  code=status(url)
                  for attempt in range(6):
                      if code in (404,410):break
                      time.sleep(7)
                      code=status(url)
                  assert code in (404,410),('Old full recording still publicly reachable',url,code)
          assert status('data/arrangements.json') in (404,410)
          print('PASS: 100 titles live, private studio audio withheld, old direct full-song links unavailable.')
          PY
