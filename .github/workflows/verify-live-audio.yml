name: Verify all 100 live AXEZENT full-length audio streams
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-audio.yml'
permissions:
  contents: read
jobs:
  public-100-audio-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify live public website, 100 MP3s, 100 compact M4As and seekable browser responses
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request,urllib.parse
          base="https://shawncalvinsnelling.github.io/AXEZENT-Beats-for-Sale/"
          def probe(url,method="HEAD",range_header=None,attempts=5):
              error=None
              for trial in range(attempts):
                  try:
                      hdr={"User-Agent":"AXEZENT-Public-100-Audio-QA/2.0","Cache-Control":"no-cache"}
                      if range_header:hdr["Range"]=range_header
                      req=urllib.request.Request(url,headers=hdr,method=method)
                      with urllib.request.urlopen(req,timeout=25) as r:
                          status=r.status
                          content_type=r.headers.get("Content-Type","")
                          length=int(r.headers.get("Content-Length","0"))
                          data=r.read(128) if method=="GET" else b""
                          return status,content_type,length,data
                  except Exception as exc:
                      error=exc
                      time.sleep(3*(trial+1))
              raise RuntimeError("Public stream unreachable "+url+" "+str(error))
          _,_,_,_ = probe(base,method="GET")
          req=urllib.request.Request(base+"data/public-preview-manifest.json",headers={"User-Agent":"AXEZENT-Public-100-Audio-QA/2.0"})
          with urllib.request.urlopen(req,timeout=30) as r:
              manifest=json.load(r)
          assert len(manifest)==100,("Expected 100 public playback links",len(manifest))
          ids=set()
          for ordinal,(ident,path) in enumerate(manifest.items(),1):
              assert ident.startswith("AXZ-") and len(ident)==7
              assert ident not in ids
              ids.add(ident)
              assert path=="./review-audio/"+ident+"-review.mp3"
              mp3=urllib.parse.urljoin(base,path)
              m4a=urllib.parse.urljoin(base,"./review-audio/"+ident+"-listen.m4a")
              for url,minimum in ((mp3,150000),(m4a,250000)):
                  status,ct,length,_=probe(url,method="HEAD")
                  assert status==200 and length>minimum,(ident,status,length,url)
              if ordinal in (1,20,50,75,100):
                  mp3status,_,_,mp3head=probe(mp3,method="GET",range_header="bytes=0-127")
                  aacstatus,_,_,aachead=probe(m4a,method="GET",range_header="bytes=0-127")
                  assert mp3status in (200,206) and aacstatus in (200,206)
                  assert mp3head.startswith(b"ID3") or (mp3head[0]==255 and (mp3head[1]&224)==224)
                  assert aachead[4:8]==b"ftyp",("Missing MP4/M4A container marker",ident,aachead[:16])
                  print("STREAMED MP3 AND M4A",ident,"MP3 HTTP",mp3status,"M4A HTTP",aacstatus,flush=True)
              if ordinal%20==0:print("VERIFIED",ordinal,"/100 full-length original and compact media pairs",flush=True)
          with urllib.request.urlopen(base+"assets/showcase.js",timeout=30) as r:
              code=r.read().decode("utf8")
          assert "-listen.m4a" in code and "compactActive" in code and "player.load()" in code
          print("PASS: website player and 200 customer-accessible full-song streams (100 MP3 + 100 AAC) verified")
          PY
