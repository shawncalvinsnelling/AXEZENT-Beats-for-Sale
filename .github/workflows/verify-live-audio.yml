name: Verify live AXEZENT browser audio URLs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-audio.yml'
permissions:
  contents: read
jobs:
  probe-public-https:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify public site, 50 review MP3 files, and seekable responses
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.request,urllib.parse,urllib.error
          base="https://shawncalvinsnelling.github.io/AXEZENT-Beats-for-Sale/"
          def load(url,method="GET",headers=None,timeout=12,attempts=12):
              error=None
              for count in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={
                        "User-Agent":"AXEZENT-Live-Audio-QA/1.0",
                        "Cache-Control":"no-cache",**(headers or {})},method=method)
                      with urllib.request.urlopen(req,timeout=timeout) as response:
                          status=response.status
                          ct=response.headers.get("Content-Type","")
                          length=int(response.headers.get("Content-Length","0"))
                          result=response.read() if method=="GET" else b""
                          return status,ct,length,result
                  except Exception as exc:
                      error=exc
                      time.sleep(4)
              raise AssertionError(f"Public URL never became reachable: {url}: {error}")
          status,ct,_,html=load(base)
          assert status==200 and b"musicArrangement" in html and b"your next song" in html
          _,ct,_,raw=load(urllib.parse.urljoin(base,"data/public-preview-manifest.json"))
          manifest=json.loads(raw)
          assert len(manifest)==50,"Expected 50 published public audio links"
          _,ct,_,raw=load(urllib.parse.urljoin(base,"data/arrangements.json"))
          arrangements=json.loads(raw)
          assert len(arrangements)==50
          track_urls=[]
          for ident,relative in manifest.items():
              assert ident in arrangements
              assert relative=="./review-audio/"+ident+"-review.mp3"
              track_urls.append(urllib.parse.urljoin(base,relative))
          for i,url in enumerate(track_urls,1):
              status,ct,size,_=load(url,method="HEAD",attempts=3)
              assert status==200 and size>150000
              assert "audio/" in ct or "octet-stream" in ct,("Unexpected media type",ct,url)
              if i in (1,2,3,25,50):
                  status,ct,length,blob=load(url,headers={"Range":"bytes=0-255"},attempts=3)
                  assert status in (200,206),(status,url)
                  assert blob[:3]==b"ID3" or (blob[0]==255 and blob[1]&224==224),(url,"MP3 header missing")
                  print("PLAYBACK STREAM:",url,status,ct,flush=True)
          print("PASS: public site loads, 50 individual public HTTPS audio files and all 50 arrangement maps respond.")
          PY
