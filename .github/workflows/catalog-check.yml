name: Catalog truth checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Reject tracked audio masters, studio files and music archives
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E -i '\.(mp3|wav|flac|aif|aiff|aac|m4a|ogg|opus|mid|midi|zip|7z|rar|sf2|sfz|rpp|flp|als|logicx|ptx)$'; then
            echo "::error::Public repository contains committed audio or studio archives"
            exit 1
          fi
          echo "PASS: no tracked music masters, MP3 files or music archive ZIPs"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile importer and README update scripts
        run: python -m py_compile scripts/import_preview_packs.py scripts/update_readme_previews.py scripts/sync_previews.py
      - name: Check private listening server syntax
        run: python -m py_compile server/axezent_site.py tests/test_private_streaming.py
      - name: Install MIDI test dependency for note-by-note verse QA
        run: python -m pip install --disable-pip-version-check "mido>=1.3,<2"
      - name: Test actual streaming, pause-capable HTTP ranges and private path blocking
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check website player JavaScript
        run: node --check assets/app.js
      - name: Validate our own one-command Linux server launcher
        run: bash -n deploy/launch-on-own-server.sh
      - name: Validate owner-controlled HTTPS website deployment configuration
        env:
          AXEZENT_DOMAIN: beats.example.org
        run: |
          docker compose -f compose.yaml config --quiet
          python - <<'PY'
          from pathlib import Path
          s=Path('Dockerfile').read_text()
          c=Path('compose.yaml').read_text()
          assert 'COPY server ./server' in s
          assert './private_previews:/private:ro' in c
          assert '443:443' in c and '80:80' in c
          print('PASS: self-hosted public preview player configuration parses')
          PY
      - name: Validate all 200 track records and absence of studio masters
        run: python scripts/check_catalog.py
