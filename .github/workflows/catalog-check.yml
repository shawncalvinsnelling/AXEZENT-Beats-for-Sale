name: Catalog truth checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile importer and README update scripts
        run: python -m py_compile scripts/import_preview_packs.py scripts/update_readme_previews.py scripts/sync_previews.py
      - name: Check private listening server syntax
        run: python -m py_compile server/axezent_site.py tests/test_private_streaming.py
      - name: Test actual streaming, pause-capable HTTP ranges and private path blocking
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check website player JavaScript
        run: node --check assets/app.js
      - name: Validate owner-controlled HTTPS website deployment configuration
        env:
          AXEZENT_DOMAIN: beats.example.org
        run: |
          docker compose -f compose.yaml config --quiet
          python - <<'PY'
          from pathlib import Path
          s=Path('Dockerfile').read_text()
          c=Path('compose.yaml').read_text()
          assert 'COPY server ./server' in s
          assert './private_previews:/private:ro' in c
          assert '443:443' in c and '80:80' in c
          print('PASS: self-hosted public preview player configuration parses')
          PY
      - name: Validate all 200 track records and absence of studio masters
        run: python scripts/check_catalog.py
