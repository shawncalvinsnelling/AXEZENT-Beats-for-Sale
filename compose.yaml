# Run this on your OWN always-on server, after setting AXEZENT_DOMAIN.
# Tagged preview MP3s live in ./private_previews (NOT in this public repository).
services:
  player:
    build: .
    restart: unless-stopped
    environment:
      AXEZENT_PREVIEW_DIR: /private
    volumes:
      - ./private_previews:/private:ro
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/ready', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      player:
        condition: service_healthy
    environment:
      AXEZENT_DOMAIN: ${AXEZENT_DOMAIN:?Set an actual domain in your private .env file}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
